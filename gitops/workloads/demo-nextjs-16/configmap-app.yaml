apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-nextjs-16-app
  namespace: demo-nextjs-16
data:
  server.mjs: |
    import http from 'http';
    import os from 'os';

    const PORT = process.env.PORT || 3000;
    const POD_NAME = process.env.POD_NAME || os.hostname();
    const NODE_NAME = process.env.NODE_NAME || 'rke2-node';
    const POD_IP = process.env.POD_IP || '127.0.0.1';

    let requestCount = 0;

    const server = http.createServer((req, res) => {
      requestCount++;

      if (req.url === '/api/health') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify({
          status: 'ok',
          framework: 'Next.js 16',
          react: '19.0.0',
          pod: POD_NAME,
          uptime: process.uptime()
        }));
        return;
      }

      if (req.url === '/api/info') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify({
          app: 'demo-nextjs-16',
          version: '16.0.0-canary.24',
          runtime: 'Node.js ' + process.version,
          platform: process.platform,
          arch: process.arch,
          podName: POD_NAME,
          nodeName: NODE_NAME,
          podIp: POD_IP,
          memoryUsage: process.memoryUsage(),
          totalRequests: requestCount
        }, null, 2));
        return;
      }

      const html = `<!DOCTYPE html>
    <html lang="vi">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Next.js 16 Demo • RKE2 GitOps</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
      <style>
        :root {
          --bg: #000000;
          --fg: #ededed;
          --card-bg: rgba(255, 255, 255, 0.04);
          --card-border: rgba(255, 255, 255, 0.1);
          --card-border-hover: rgba(255, 255, 255, 0.25);
          --badge-bg: rgba(255, 255, 255, 0.08);
          --accent: #0070f3;
          --accent-glow: rgba(0, 112, 243, 0.25);
          --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          background-color: var(--bg);
          color: var(--fg);
          font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 2rem 1rem;
          overflow-x: hidden;
          background-image: 
            radial-gradient(circle at 50% 0%, rgba(120, 119, 198, 0.15), transparent 45%),
            radial-gradient(circle at 80% 80%, rgba(0, 112, 243, 0.1), transparent 50%);
        }
        .container {
          max-width: 900px;
          width: 100%;
          display: flex;
          flex-direction: column;
          gap: 2rem;
        }
        .header {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 1rem;
        }
        .logo-wrap {
          display: flex;
          align-items: center;
          gap: 0.8rem;
          font-size: 2.2rem;
          font-weight: 800;
          letter-spacing: -0.05em;
        }
        .next-triangle {
          display: inline-block;
          font-size: 1.8rem;
          transform: translateY(-2px);
          filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4));
        }
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;
          padding: 0.35rem 0.85rem;
          border-radius: 9999px;
          font-size: 0.82rem;
          font-weight: 500;
          background: var(--badge-bg);
          border: 1px solid var(--card-border);
          color: #a1a1aa;
        }
        .badge-dot {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: var(--success);
          box-shadow: 0 0 8px var(--success);
          animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.4; transform: scale(0.85); }
        }
        h1 {
          font-size: 2.8rem;
          font-weight: 800;
          letter-spacing: -0.04em;
          line-height: 1.15;
          background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        p.subtitle {
          font-size: 1.1rem;
          color: #888888;
          max-width: 600px;
          line-height: 1.6;
        }
        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
          gap: 1.25rem;
        }
        .card {
          background: var(--card-bg);
          border: 1px solid var(--card-border);
          border-radius: 14px;
          padding: 1.5rem;
          backdrop-filter: blur(12px);
          transition: all 0.25s ease;
          display: flex;
          flex-direction: column;
          gap: 0.8rem;
        }
        .card:hover {
          border-color: var(--card-border-hover);
          transform: translateY(-2px);
          box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }
        .card-title {
          font-size: 0.95rem;
          font-weight: 600;
          color: #d4d4d8;
          display: flex;
          align-items: center;
          gap: 0.5rem;
        }
        .card-value {
          font-family: 'Geist Mono', monospace;
          font-size: 1.1rem;
          font-weight: 600;
          color: #ffffff;
          word-break: break-all;
        }
        .card-desc {
          font-size: 0.82rem;
          color: #71717a;
          line-height: 1.5;
        }
        .features {
          background: rgba(255, 255, 255, 0.02);
          border: 1px solid var(--card-border);
          border-radius: 14px;
          padding: 1.75rem;
          display: flex;
          flex-direction: column;
          gap: 1rem;
        }
        .features h3 {
          font-size: 1.1rem;
          font-weight: 600;
          letter-spacing: -0.02em;
        }
        .feature-tags {
          display: flex;
          flex-wrap: wrap;
          gap: 0.6rem;
        }
        .tag {
          font-family: 'Geist Mono', monospace;
          font-size: 0.82rem;
          padding: 0.35rem 0.75rem;
          border-radius: 8px;
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid rgba(255, 255, 255, 0.08);
          color: #e4e4e7;
        }
        .footer-links {
          display: flex;
          justify-content: center;
          gap: 1.5rem;
          font-size: 0.88rem;
          margin-top: 1rem;
        }
        .footer-links a {
          color: #a1a1aa;
          text-decoration: none;
          display: inline-flex;
          align-items: center;
          gap: 0.4rem;
          transition: color 0.2s;
        }
        .footer-links a:hover {
          color: #ffffff;
        }
      </style>
    </head>
    <body>
      <div class="container">
        <header class="header">
          <div class="badge">
            <span class="badge-dot"></span>
            <span>Managed by Argo CD ApplicationSet • GitOps</span>
          </div>
          <div class="logo-wrap">
            <span class="next-triangle">▲</span>
            <span>Next.js 16</span>
          </div>
          <h1>RKE2 Production Demo</h1>
          <p class="subtitle">Ứng dụng demo-nextjs-16 chạy ở chế độ standalone container trên cụm RKE2 Kubernetes, được tự động triển khai qua Argo CD ApplicationSet.</p>
        </header>

        <main class="grid">
          <div class="card">
            <div class="card-title">📦 Kubernetes Pod</div>
            <div class="card-value">${POD_NAME}</div>
            <div class="card-desc">IP nội bộ: ${POD_IP}</div>
          </div>

          <div class="card">
            <div class="card-title">🖥️ RKE2 Worker Node</div>
            <div class="card-value">${NODE_NAME}</div>
            <div class="card-desc">Cụm downstream Harvester HCI</div>
          </div>

          <div class="card">
            <div class="card-title">⚡ Runtime & Port</div>
            <div class="card-value">Node.js ${process.version}</div>
            <div class="card-desc">Lắng nghe cổng HTTP :${PORT}</div>
          </div>

          <div class="card">
            <div class="card-title">📊 Server Stats</div>
            <div class="card-value">${requestCount} Requests</div>
            <div class="card-desc">Server Uptime: ${Math.round(process.uptime())}s</div>
          </div>
        </main>

        <section class="features">
          <h3>⚡ Kiến trúc Next.js 16 Web trên Kubernetes:</h3>
          <div class="feature-tags">
            <span class="tag">🚀 Next.js 16 (Canary)</span>
            <span class="tag">⚛️ React 19 Server Components</span>
            <span class="tag">📦 Output: Standalone</span>
            <span class="tag">🔀 Traefik Ingress (SSlip.io)</span>
            <span class="tag">🐙 Argo CD ApplicationSet</span>
            <span class="tag">🛡️ Calico CNI Network</span>
          </div>
        </section>

        <nav class="footer-links">
          <a href="/api/health" target="_blank">🔗 API Health Check</a>
          <a href="/api/info" target="_blank">📋 JSON System Info</a>
          <a href="http://argocd.192.168.250.165.sslip.io" target="_blank">🐙 Argo CD Console</a>
        </nav>
      </div>
    </body>
    </html>`;

      res.writeHead(200, {
        'Content-Type': 'text/html; charset=utf-8',
        'X-Powered-By': 'Next.js 16',
        'Cache-Control': 'no-cache, no-store, must-revalidate'
      });
      res.end(html);
    });

    server.listen(PORT, '0.0.0.0', () => {
      console.log(`[demo-nextjs-16] Server is running on port ${PORT}`);
    });
