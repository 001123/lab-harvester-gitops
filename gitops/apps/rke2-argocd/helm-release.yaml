apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-cd
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: argocd
  storageNamespace: argocd
  kubeConfig:
    secretRef:
      name: rke2-kubeconfig
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: argo-cd
      version: "10.8.4"
      sourceRef:
        kind: HelmRepository
        name: argo-helm
        namespace: flux-system
  values:
    global:
      domain: argocd.192.168.250.165.sslip.io
    server:
      insecure: true
      service:
        type: NodePort
        nodePortHttp: 30080
      ingress:
        enabled: true
        ingressClassName: traefik
        hostname: argocd.192.168.250.165.sslip.io
        paths:
          - /
        pathType: Prefix
        extraHosts:
          - name: argocd.192.168.250.223.sslip.io
            path: /
            pathType: Prefix
    configs:
      cm:
        kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
        timeout.reconciliation: 180s
        resource.customizations.health.networking.k8s.io_Ingress: |
          hs = {}
          hs.status = "Healthy"
          return hs
      params:
        server.insecure: true
