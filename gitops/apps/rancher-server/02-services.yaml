apiVersion: v1
kind: Service
metadata:
  name: rancher-server-service
  namespace: default
spec:
  type: NodePort
  selector:
    vm.kubevirt.io/name: rancher-server
  ports:
  - name: https
    port: 443
    targetPort: 443
    nodePort: 31443
  - name: http
    port: 80
    targetPort: 80
    nodePort: 31080
  - name: ssh
    port: 22
    targetPort: 22
    nodePort: 31022
  - name: k3s-api
    port: 6443
    targetPort: 6443
    nodePort: 31643
