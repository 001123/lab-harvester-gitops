apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/001123/lab-harvester-gitops.git
    targetRevision: main
    path: gitops/infrastructure/rancher-server
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
