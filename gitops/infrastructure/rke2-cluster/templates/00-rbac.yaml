apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harvester-machine-provisioner-cluster
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harvester-machine-provisioner-binding
subjects:
  - kind: Group
    name: system:serviceaccounts:fleet-default
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: harvester-machine-provisioner-cluster
  apiGroup: rbac.authorization.k8s.io
