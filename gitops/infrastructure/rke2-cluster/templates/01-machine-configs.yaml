apiVersion: rke-machine-config.cattle.io/v1
kind: HarvesterConfig
metadata:
  name: "{{ .Values.clusterName }}-wk-config"
  namespace: "{{ .Values.namespace }}"
clusterId: {{ .Values.harvesterClusterId | quote }}
clusterType: imported
vmNamespace: default
cpuCount: {{ .Values.workers.cpuCount | quote }}
memorySize: {{ .Values.workers.memorySize | quote }}
diskSize: {{ .Values.workers.diskSize | quote }}
imageName: {{ .Values.imageName | quote }}
networkName: {{ .Values.networkName | quote }}
networkModel: virtio
sshUser: {{ .Values.sshUser | quote }}
userData: 
