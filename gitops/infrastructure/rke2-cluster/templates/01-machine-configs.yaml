apiVersion: rke-machine-config.cattle.io/v1
kind: HarvesterConfig
metadata:
  name: "{{ .Values.clusterName }}-cp-config"
  namespace: "{{ .Values.namespace }}"
clusterId: {{ .Values.harvesterClusterId | quote }}
clusterType: imported
vmNamespace: default
cpuCount: {{ .Values.controlPlane.cpuCount | quote }}
memorySize: {{ .Values.controlPlane.memorySize | quote }}
diskSize: {{ .Values.controlPlane.diskSize | quote }}
imageName: {{ .Values.imageName | quote }}
networkName: {{ .Values.networkName | quote }}
networkModel: virtio
sshUser: {{ .Values.sshUser | quote }}
userData: 
