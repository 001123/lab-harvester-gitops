apiVersion: v1
kind: Secret
metadata:
    name: rancher-cloudinit
    namespace: default
type: Opaque
stringData:
    userdata: |
        #cloud-config
        users:
          - default
          - name: opensuse
            groups: [wheel, sudo, users]
            sudo: ["ALL=(ALL) NOPASSWD:ALL"]
            shell: /bin/bash
            lock_passwd: false
            ssh_authorized_keys:
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPaWkIWwJqchLwmCMSN3hmUDVg08y3SU5L544sJSFpbW timi@Timi-Macbook-Pro-16-M4-Pro.local
        chpasswd:
          list: |
            opensuse:rancher@2026!
            root:rancher@2026!
          expire: False
        ssh_pwauth: true
        write_files:
          - path: /opt/bootstrap-rancher.sh
            permissions: '0755'
            content: |
              #!/usr/bin/env bash
              set -eo pipefail
              LOGFILE="/var/log/rancher-bootstrap.log"
              exec > >(tee -a "$LOGFILE") 2>&1

              export HOME=/root
              cd /root

              echo "=== [$(date)] BẮT ĐẦU BOOTSTRAP RANCHER MANAGEMENT CLUSTER TRÊN OPENSUSE LEAP MICRO 6.2 ==="

              echo "=== 1. Cấu hình môi trường openSUSE ==="
              setenforce 0 || true
              if [[ -f /etc/selinux/config ]]; then
                sed -i 's/^SELINUX=enforcing/SELINUX=permissive/' /etc/selinux/config || true
              fi

              mkdir -p /usr/local/bin
              export PATH="/usr/local/bin:$PATH"

              echo "=== 2. Kích hoạt qemu-guest-agent & Host mapping ==="
              systemctl enable --now qemu-guest-agent || true
              echo "192.168.250.2 rancher.192.168.250.2.sslip.io" >> /etc/hosts || true

              echo "=== 3. Kiểm tra kết nối Internet ==="
              until curl -s --connect-timeout 5 https://github.com >/dev/null || curl -s --connect-timeout 5 https://google.com >/dev/null; do
                echo "Đang chờ kết nối mạng..."
                sleep 3
              done

              echo "=== 4. Cài đặt K3s Server ==="
              curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="v1.36.4+k3s1" INSTALL_K3S_BIN_DIR="/usr/local/bin" INSTALL_K3S_EXEC="server --tls-san rancher.192.168.250.2.sslip.io --tls-san 192.168.250.2 --tls-san 192.168.250.20 --write-kubeconfig-mode 644" sh -
              systemctl start k3s || true

              export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

              echo "=== 5. Chờ K3s node Ready ==="
              until kubectl get nodes 2>/dev/null | grep -q ' Ready'; do
                echo "Đang chờ K3s node sẵn sàng..."
                sleep 3
              done

              echo "=== 6. Cài đặt Helm v3 ==="
              if ! command -v helm &>/dev/null; then
                curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | USE_SUDO=false BINARY_DIR="/usr/local/bin" bash
              fi

              echo "=== 7. Cài đặt Jetstack Cert-Manager ==="
              helm repo add jetstack https://charts.jetstack.io || true
              helm repo add rancher-stable https://releases.rancher.com/server-charts/stable || true
              helm repo update

              kubectl create namespace cert-manager || true
              helm upgrade --install cert-manager jetstack/cert-manager \
                --namespace cert-manager \
                --set crds.enabled=true \
                --wait \
                --timeout 5m

              echo "=== 8. Cài đặt Rancher Manager (v2.10+) ==="
              kubectl create namespace cattle-system || true
              helm upgrade --install rancher rancher-stable/rancher \
                --namespace cattle-system \
                --set hostname=rancher.192.168.250.2.sslip.io \
                --set bootstrapPassword=admin@2026!! \
                --set replicas=1 \
                --set global.cattle.psp.enabled=false \
                --wait \
                --timeout 15m

              echo "=== 9. Cấu hình server-url cho Rancher ==="
              until kubectl get setting.management.cattle.io/server-url >/dev/null 2>&1; do
                echo "Đang chờ Rancher Settings CRD..."
                sleep 5
              done
              kubectl patch setting server-url --type=merge -p '{"value":"https://rancher.192.168.250.2.sslip.io:31443"}' || true

              echo "=== [$(date)] HOÀN TẤT TRIỂN KHAI RANCHER THÀNH CÔNG ==="
        runcmd:
          - /bin/bash /opt/bootstrap-rancher.sh
