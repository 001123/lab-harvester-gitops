apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rancher-server
  namespace: flux-system
spec:
  interval: 5m
  path: ./gitops/apps/rancher-server
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  timeout: 5m
