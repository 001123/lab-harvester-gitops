# ==============================================================================
# Giá trị cấu hình Helm Argo CD Hub trên Harvester HCI
# Phiên bản Chart: argo/argo-cd 10.8.4 (Argo CD v3.5.2)
# ==============================================================================

global:
  domain: argocd.192.168.250.2.sslip.io

server:
  insecure: true
  service:
    type: NodePort
    nodePortHttp: 30080
    nodePortHttps: 30443

configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 180s
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Healthy"
      return hs

repoServer:
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /home/argocd/.config/sops/age
      name: sops-age
  env:
    - name: XDG_CONFIG_HOME
      value: /home/argocd/.config
    - name: SOPS_AGE_KEY_FILE
      value: /home/argocd/.config/sops/age/keys.txt
