apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-nextjs
  namespace: web-nextjs
  labels:
    app.kubernetes.io/name: web-nextjs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-nextjs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-nextjs
    spec:
      containers:
        - name: nextjs
          image: node:22-alpine
          command: ["node", "/app/server.mjs"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          configMap:
            name: web-nextjs-app
