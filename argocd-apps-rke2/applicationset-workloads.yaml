apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rke2-workloads
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/001123/lab-harvester-gitops.git
        revision: main
        directories:
          - path: argocd-apps-rke2/workloads/*
  template:
    metadata:
      name: '{{path.basename}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/001123/lab-harvester-gitops.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
